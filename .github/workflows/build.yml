name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.301'

      - name: Install Inno Setup
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Test audio pipeline and build packages
        run: .\build.ps1

      - name: Verify installer and uninstaller
        run: .\tests\verify-package.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP "ApolloMicBridge-verification")

      - name: Upload package verification diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ApolloMicBridge-verification-diagnostics
          path: |
            ${{ runner.temp }}/ApolloMicBridge-verification/**/*.log
            ${{ runner.temp }}/ApolloMicBridge-verification/**/*.png
            ${{ runner.temp }}/ApolloMicBridge-verification/**/*.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ApolloMicBridge-win-x64
          path: |
            dist/ApolloMicBridge-Setup-*.exe
            dist/ApolloMicBridge-Portable-win-x64.zip
          if-no-files-found: error
          compression-level: 0
